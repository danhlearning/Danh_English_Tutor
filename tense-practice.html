<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Tập 6 Thì Tiếng Anh</title>
    <link rel="stylesheet" href="./assets/css/pages/tense-practice.css">
</head>
<body>

<div class="container">
    <h1>📝 Luyện Tập Ngữ Pháp</h1>
    
    <div class="controls">
        <select id="tense-select" onchange="startQuiz()">
            <option value="Present Simple">Thì Hiện tại đơn</option>
            <option value="Present Continuous">Thì Hiện tại tiếp diễn</option>
            <option value="Past Simple">Thì Quá khứ đơn</option>
            <option value="Past Continuous">Thì Quá khứ tiếp diễn</option>
            <option value="Future Simple">Thì Tương lai đơn</option>
            <option value="Present Perfect">Thì Hiện tại hoàn thành</option>
        </select>
        <div class="progress" id="progress">Câu: 1/0</div>
    </div>

    <div class="question-box" id="question-text">
        <!-- Câu hỏi sẽ hiển thị ở đây -->
    </div>

    <div class="input-area" id="input-area">
        <input type="text" id="answer-input" placeholder="Nhập động từ đã chia..." autocomplete="off">
        <button class="btn-check" id="check-btn" onclick="checkAnswer()">Kiểm tra</button>
    </div>

    <div id="feedback" class="feedback"></div>
    <div id="explanation" class="explanation"></div>

    <button class="btn-next" id="next-btn" onclick="nextQuestion()">Câu tiếp theo ➔</button>
</div>

<script src="./assets/js/pages/tense-practice.js"></script>

</body>
</html>
