<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Tập 6 Thì Tiếng Anh</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --hover-color: #45a049;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 650px;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
            flex: 1;
            min-width: 200px;
        }
        .progress {
            font-weight: bold;
            color: #666;
            font-size: 16px;
        }
        .question-box {
            background: #eef2f3;
            padding: 20px;
            border-radius: 8px;
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: var(--primary-color);
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-check {
            background-color: var(--primary-color);
            color: white;
            white-space: nowrap;
        }
        .btn-check:hover { background-color: var(--hover-color); }
        .btn-next {
            background-color: #2196F3;
            color: white;
            display: none;
            width: 100%;
            margin-top: 10px;
        }
        .btn-next:hover { background-color: #0b7dda; }
        .feedback {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .correct { color: #4CAF50; }
        .incorrect { color: #f44336; }
        .explanation {
            background: #fff3cd;
            color: #856404;
            padding: 15px;
            border-left: 5px solid #ffeeba;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
            font-size: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 Luyện Tập Ngữ Pháp</h1>
    
    <div class="controls">
        <select id="tense-select" onchange="startQuiz()">
            <option value="Present Simple">Thì Hiện tại đơn</option>
            <option value="Present Continuous">Thì Hiện tại tiếp diễn</option>
            <option value="Past Simple">Thì Quá khứ đơn</option>
            <option value="Past Continuous">Thì Quá khứ tiếp diễn</option>
            <option value="Future Simple">Thì Tương lai đơn</option>
            <option value="Present Perfect">Thì Hiện tại hoàn thành</option>
        </select>
        <div class="progress" id="progress">Câu: 1/0</div>
    </div>

    <div class="question-box" id="question-text">
        <!-- Câu hỏi sẽ hiển thị ở đây -->
    </div>

    <div class="input-area" id="input-area">
        <input type="text" id="answer-input" placeholder="Nhập động từ đã chia..." autocomplete="off">
        <button class="btn-check" id="check-btn" onclick="checkAnswer()">Kiểm tra</button>
    </div>

    <div id="feedback" class="feedback"></div>
    <div id="explanation" class="explanation"></div>

    <button class="btn-next" id="next-btn" onclick="nextQuestion()">Câu tiếp theo ➔</button>
</div>

<script>
    const quizData = {
    "Present Simple": [
        // Cơ bản (1-10)
        { question: "1. I usually (go) ________ to the gym at 6 AM. [Cơ bản]", answer: "go", explanation: "Dấu hiệu 'usually' chỉ thói quen. Chủ ngữ 'I' -> V giữ nguyên." },
        { question: "2. The sun (rise) ________ in the east. [Cơ bản]", answer: "rises", explanation: "Sự thật hiển nhiên/chân lý. Chủ ngữ số ít 'The sun' -> V thêm 's'." },
        { question: "3. She (not/eat) ________ meat because she is a vegetarian. [Cơ bản]", answer: "does not eat / doesn't eat", explanation: "Câu phủ định HTĐ, chủ ngữ 'She' mượn 'does'." },
        { question: "4. ________ (they/play) tennis every weekend? [Cơ bản]", answer: "Do they play", explanation: "Câu hỏi với chủ ngữ số nhiều 'they' mượn trợ động từ 'Do'." },
        { question: "5. My father (watch) ________ the news every evening. [Cơ bản]", answer: "watches", explanation: "Thói quen hàng ngày. Động từ tận cùng 'ch' thêm 'es'." },
        { question: "6. Water (freeze) ________ at 0 degrees Celsius. [Cơ bản]", answer: "freezes", explanation: "Sự thật khoa học." },
        { question: "7. We (have) ________ English classes twice a week. [Cơ bản]", answer: "have", explanation: "Lịch học định kỳ, chủ ngữ 'We' -> V giữ nguyên." },
        { question: "8. He (always/forget) ________ his keys. [Cơ bản]", answer: "always forgets", explanation: "Trạng từ tần suất đứng trước động từ thường." },
        { question: "9. The dog (bark) ________ loudly when strangers come. [Cơ bản]", answer: "barks", explanation: "Bản năng, thói quen của động vật." },
        { question: "10. I (not/know) ________ the answer to this question. [Cơ bản]", answer: "do not know / don't know", explanation: "Động từ trạng thái 'know' luôn dùng ở thể đơn, không dùng tiếp diễn." },
        // Trung bình (11-20)
        { question: "11. The train to London (depart) ________ at 9:00 AM tomorrow. [Trung bình]", answer: "departs", explanation: "Lịch trình cố định dù có thời gian tương lai." },
        { question: "12. This box (contain) ________ important documents. [Trung bình]", answer: "contains", explanation: "'Contain' là động từ trạng thái (state verb), chỉ dùng HTĐ." },
        { question: "13. How much ________ (this laptop/cost)? [Trung bình]", answer: "does this laptop cost", explanation: "Hỏi giá cả, 'cost' là động từ thường." },
        { question: "14. Neither of the options (seem) ________ acceptable. [Trung bình]", answer: "seems", explanation: "'Neither of + N' theo ngữ pháp chuẩn động từ chia số ít." },
        { question: "15. The exhibition (open) ________ until the end of the month. [Trung bình]", answer: "opens", explanation: "Lịch hoạt động của triển lãm." },
        { question: "16. As soon as he (arrive) ________, we will discuss the issue. [Trung bình]", answer: "arrives", explanation: "Mệnh đề thời gian với 'As soon as' diễn tả tương lai dùng HTĐ." },
        { question: "17. It (not/matter) ________ what you wear to the party. [Trung bình]", answer: "does not matter / doesn't matter", explanation: "Cụm 'It doesn't matter' (Không quan trọng)." },
        { question: "18. Who (belong) ________ this pen to? [Trung bình]", answer: "does this pen belong", explanation: "Cấu trúc hỏi sự sở hữu với động từ trạng thái 'belong'." },
        { question: "19. If you (mix) ________ red and blue, you get purple. [Trung bình]", answer: "mix", explanation: "Câu điều kiện loại 0 diễn tả sự thật hiển nhiên." },
        { question: "20. The committee usually (meet) ________ on the first Friday of the month. [Trung bình]", answer: "meets", explanation: "Danh từ tập hợp 'committee' hoạt động như một thể thống nhất -> V chia số ít." },
        // Nâng cao - TOEIC/IELTS (21-30)
        { question: "21. The latest financial report (indicate) ________ a steady growth in revenue. [TOEIC]", answer: "indicates", explanation: "Báo cáo chỉ ra sự việc ở hiện tại. 'report' là số ít." },
        { question: "22. All employees (require) ________ a valid ID to access the building. [TOEIC]", answer: "require", explanation: "Quy định chung của công ty. (Nếu là bị động sẽ là 'are required', nhưng dạng chủ động dùng HTĐ)." },
        { question: "23. The revised policy (stipulate) ________ that overtime must be pre-approved. [TOEIC]", answer: "stipulates", explanation: "Văn bản/chính sách 'quy định' (stipulate) điều gì luôn dùng HTĐ." },
        { question: "24. Our firm (specialize) ________ in international trade law. [TOEIC]", answer: "specializes", explanation: "Lĩnh vực hoạt động cốt lõi của doanh nghiệp." },
        { question: "25. The CEO's innovative approach (encompass) ________ both sustainability and profit. [IELTS]", answer: "encompasses", explanation: "Mô tả đặc điểm của một phương pháp (encompass = bao gồm)." },
        { question: "26. Demand for renewable energy currently (outpace) ________ supply. [IELTS]", answer: "outpaces", explanation: "Dù có 'currently', diễn tả một thực trạng/xu hướng chung mang tính ổn định thì vẫn dùng HTĐ." },
        { question: "27. Every purchase of this product (contribute) ________ to local charities. [TOEIC]", answer: "contributes", explanation: "'Every + N số ít' -> động từ luôn chia số ít." },
        { question: "28. The board of directors strictly (prohibit) ________ smoking on the premises. [TOEIC]", answer: "prohibits", explanation: "Nội quy cố định của công ty." },
        { question: "29. This comprehensive manual (provide) ________ detailed instructions for assembly. [TOEIC]", answer: "provides", explanation: "Chức năng, mục đích của một tài liệu hướng dẫn." },
        { question: "30. The phenomenon (occur) ________ when the temperature drops below freezing. [IELTS]", answer: "occurs", explanation: "Giải thích cơ chế hoạt động của một hiện tượng khoa học." }
    ],

    "Present Continuous": [
        // Cơ bản (1-10)
        { question: "1. Listen! Someone (knock) ________ at the door. [Cơ bản]", answer: "is knocking", explanation: "Dấu hiệu 'Listen!' -> sự việc đang xảy ra." },
        { question: "2. I (read) ________ an interesting book at the moment. [Cơ bản]", answer: "am reading", explanation: "Dấu hiệu 'at the moment' (ngay lúc này)." },
        { question: "3. They (not/play) ________ football in the garden right now. [Cơ bản]", answer: "are not playing / aren't playing", explanation: "Dấu hiệu 'right now'." },
        { question: "4. What ________ (you/do) under the table? [Cơ bản]", answer: "are you doing", explanation: "Hỏi ai đó đang làm gì tại thời điểm nói." },
        { question: "5. Look! The bus (come) ________. [Cơ bản]", answer: "is coming", explanation: "Dấu hiệu 'Look!' -> Hành động đang tới." },
        { question: "6. She (wear) ________ a beautiful red dress today. [Cơ bản]", answer: "is wearing", explanation: "Diễn tả trang phục đang mặc trên người ngày hôm nay." },
        { question: "7. Please be quiet! The children (study) ________ for their exams. [Cơ bản]", answer: "are studying", explanation: "Yêu cầu trật tự vì một hành động khác đang diễn ra." },
        { question: "8. We (have) ________ lunch, can I call you back later? [Cơ bản]", answer: "are having", explanation: "'Have' mang nghĩa 'ăn/uống' được chia ở dạng V-ing." },
        { question: "9. Why ________ (the baby/cry) so loudly? [Cơ bản]", answer: "is the baby crying", explanation: "Hỏi lý do sự việc đang diễn ra." },
        { question: "10. It (rain) ________ heavily outside. [Cơ bản]", answer: "is raining", explanation: "Mô tả thời tiết ngay thời điểm nói." },
        // Trung bình (11-20)
        { question: "11. My English (improve) ________ slowly but surely. [Trung bình]", answer: "is improving", explanation: "Sự thay đổi, phát triển đang diễn ra dần dần." },
        { question: "12. I (meet) ________ my friends for dinner tonight. [Trung bình]", answer: "am meeting", explanation: "Kế hoạch đã sắp xếp chắc chắn sẽ xảy ra trong tương lai gần." },
        { question: "13. He (always/interrupt) ________ me when I am speaking! [Trung bình]", answer: "is always interrupting", explanation: "Phàn nàn về thói quen xấu với 'always'." },
        { question: "14. More and more people (choose) ________ to work from home. [Trung bình]", answer: "are choosing", explanation: "Xu hướng thay đổi trong xã hội (More and more...)." },
        { question: "15. I (think) ________ of changing my career path. [Trung bình]", answer: "am thinking", explanation: "'Think' mang nghĩa cân nhắc, suy tính -> Dùng V-ing." },
        { question: "16. The climate (get) ________ warmer every year. [Trung bình]", answer: "is getting", explanation: "Sự việc đang thay đổi từng ngày (get + adj-er)." },
        { question: "17. Currently, we (rent) ________ a small apartment until we buy a house. [Trung bình]", answer: "are renting", explanation: "Tình trạng mang tính chất tạm thời (temporary situation)." },
        { question: "18. ________ (you/use) this chair? No, you can take it. [Trung bình]", answer: "Are you using", explanation: "Hỏi xem có ai đang sử dụng đồ vật ngay lúc này không." },
        { question: "19. The chef (taste) ________ the soup to see if it needs more salt. [Trung bình]", answer: "is tasting", explanation: "'Taste' mang nghĩa hành động 'nếm thử' -> Dùng V-ing." },
        { question: "20. The local council (build) ________ a new bridge across the river. [Trung bình]", answer: "is building", explanation: "Hành động đang diễn ra xung quanh thời điểm nói (dự án)." },
        // Nâng cao - TOEIC/IELTS (21-30)
        { question: "21. The management (currently/negotiate) ________ a merger with a rival company. [TOEIC]", answer: "is currently negotiating", explanation: "Dự án, quá trình thương lượng đang diễn ra trong tổ chức." },
        { question: "22. Our firm (undergo) ________ major structural changes this quarter. [TOEIC]", answer: "is undergoing", explanation: "Sự thay đổi mang tính chất tạm thời, diễn ra trong quý này." },
        { question: "23. Consumer preferences (gradually/shift) ________ towards eco-friendly products. [IELTS]", answer: "are gradually shifting", explanation: "Mô tả một xu hướng chuyển dịch dần dần trong biểu đồ/xã hội." },
        { question: "24. We (implement) ________ a new software system across all departments. [TOEIC]", answer: "are implementing", explanation: "Một dự án công ty đang trong quá trình thực thi." },
        { question: "25. The proportion of elderly citizens (steadily/rise) ________ in most developed nations. [IELTS]", answer: "is steadily rising", explanation: "Mô tả số liệu đang tăng lên liên tục." },
        { question: "26. The technical team (address) ________ the server issues as we speak. [TOEIC]", answer: "is addressing", explanation: "Cụm 'as we speak' = 'right now' (ngay lúc chúng ta đang nói)." },
        { question: "27. Competitors (aggressively/expand) ________ their market share in Asia. [IELTS]", answer: "are aggressively expanding", explanation: "Hành động chiến lược đang diễn ra của các đối thủ." },
        { question: "28. The industry (phase) ________ out single-use plastics due to new regulations. [IELTS]", answer: "is phasing", explanation: "Quá trình loại bỏ dần (phase out) đang được tiến hành." },
        { question: "29. The HR department (conduct) ________ interviews for the vacant managerial role. [TOEIC]", answer: "is conducting", explanation: "Hoạt động tuyển dụng đang diễn ra." },
        { question: "30. Urban areas (experience) ________ an unprecedented housing crisis. [IELTS]", answer: "are experiencing", explanation: "Trải qua một hiện tượng/khủng hoảng ở thời điểm hiện tại." }
    ],

    "Past Simple": [
        // Cơ bản (1-10)
        { question: "1. We (visit) ________ the museum yesterday. [Cơ bản]", answer: "visited", explanation: "Dấu hiệu 'yesterday'. V có quy tắc thêm -ed." },
        { question: "2. She (buy) ________ a new laptop last week. [Cơ bản]", answer: "bought", explanation: "Dấu hiệu 'last week'. 'buy' -> 'bought'." },
        { question: "3. They (not/go) ________ to the cinema with us. [Cơ bản]", answer: "did not go / didn't go", explanation: "Phủ định quá khứ dùng 'did not' + V." },
        { question: "4. ________ (you/see) the match last night? [Cơ bản]", answer: "Did you see", explanation: "Câu hỏi dạng Yes/No quá khứ mượn 'Did'." },
        { question: "5. I (find) ________ my lost keys under the sofa. [Cơ bản]", answer: "found", explanation: "Hành động đã kết thúc. 'find' -> 'found'." },
        { question: "6. He (leave) ________ the house an hour ago. [Cơ bản]", answer: "left", explanation: "Dấu hiệu 'ago' -> QKĐ." },
        { question: "7. We (have) ________ a great time at the party. [Cơ bản]", answer: "had", explanation: "Kể lại trải nghiệm đã qua." },
        { question: "8. The train (stop) ________ at the station for five minutes. [Cơ bản]", answer: "stopped", explanation: "Hành động ngắn đã kết thúc. 'stop' gấp đôi 'p' -> 'stopped'." },
        { question: "9. I (not/know) ________ about the meeting. [Cơ bản]", answer: "did not know / didn't know", explanation: "Không biết trong quá khứ." },
        { question: "10. Where ________ (she/put) her glasses? [Cơ bản]", answer: "did she put", explanation: "Câu hỏi Wh- với QKĐ." },
        // Trung bình (11-20)
        { question: "11. When I was a child, I (want) ________ to be a pilot. [Trung bình]", answer: "wanted", explanation: "Kể về sự thật/ước mơ trong thời thơ ấu." },
        { question: "12. She opened the door, turned on the light, and (smile) ________. [Trung bình]", answer: "smiled", explanation: "Chuỗi hành động liên tiếp trong quá khứ." },
        { question: "13. I suddenly (realize) ________ that I had forgotten my wallet. [Trung bình]", answer: "realized", explanation: "Hành động nhận ra xảy ra đột ngột trong quá khứ." },
        { question: "14. The company (decide) ________ to cancel the project due to a lack of funds. [Trung bình]", answer: "decided", explanation: "Quyết định đã được đưa ra." },
        { question: "15. How long ________ (it/take) you to finish the assignment? [Trung bình]", answer: "did it take", explanation: "Hỏi về khoảng thời gian đã mất trong quá khứ." },
        { question: "16. Alexander Fleming (discover) ________ penicillin in 1928. [Trung bình]", answer: "discovered", explanation: "Sự kiện lịch sử có mốc thời gian rõ ràng." },
        { question: "17. It (be) ________ very cold yesterday, so we stayed at home. [Trung bình]", answer: "was", explanation: "Động từ to be ở QKĐ với chủ ngữ 'It'." },
        { question: "18. Although he studied hard, he (fail) ________ the exam. [Trung bình]", answer: "failed", explanation: "Kể lại một kết quả đã qua." },
        { question: "19. The electricity (go) ________ off right in the middle of the game. [Trung bình]", answer: "went", explanation: "Sự cố xảy ra cắt ngang." },
        { question: "20. I (apply) ________ for the scholarship, but I wasn't selected. [Trung bình]", answer: "applied", explanation: "Hành động nộp đơn đã kết thúc. 'apply' đổi 'y' thành 'ied'." },
        // Nâng cao - TOEIC/IELTS (21-30)
        { question: "21. Revenue from online sales (plummet) ________ during the last quarter of 2022. [IELTS]", answer: "plummeted", explanation: "Mô tả biểu đồ quá khứ: plummet (lao dốc)." },
        { question: "22. The board of directors (reject) ________ the initial proposal outright. [TOEIC]", answer: "rejected", explanation: "Hành động từ chối của ban giám đốc trong một kỳ họp đã qua." },
        { question: "23. Our founder (establish) ________ the headquarters in Tokyo 20 years ago. [TOEIC]", answer: "established", explanation: "Thành lập công ty, có mốc thời gian 'ago'." },
        { question: "24. Sales figures (peak) ________ at $2 million in November. [IELTS]", answer: "peaked", explanation: "Mô tả điểm cao nhất trong biểu đồ năm ngoái." },
        { question: "25. The merger significantly (boost) ________ the firm's market value last year. [TOEIC]", answer: "boosted", explanation: "Tác động của vụ sáp nhập đã kết thúc năm ngoái." },
        { question: "26. During the 1990s, the tech industry (experience) ________ an unprecedented boom. [IELTS]", answer: "experienced", explanation: "Kể về một giai đoạn thập niên 90." },
        { question: "27. The committee (draft) ________ a comprehensive resolution after the debate. [TOEIC]", answer: "drafted", explanation: "Hành động phác thảo văn bản sau cuộc tranh luận." },
        { question: "28. Production costs (outpace) ________ revenue, leading to bankruptcy. [IELTS]", answer: "outpaced", explanation: "Chi phí vượt doanh thu trong quá khứ." },
        { question: "29. The regulatory body (impose) ________ strict fines on the violators. [TOEIC]", answer: "imposed", explanation: "Cơ quan áp đặt lệnh phạt (đã hoàn tất)." },
        { question: "30. The marketing campaign (generate) ________ over 10,000 leads in its first week. [TOEIC]", answer: "generated", explanation: "Kết quả thu được từ tuần đầu tiên của chiến dịch đã qua." }
    ],

    "Past Continuous": [
        // Cơ bản (1-10)

    let currentTense = "";
    let currentQuestionIndex = 0;
    let questionsList = [];

    // Khởi tạo bài tập khi chọn Thì
    function startQuiz() {
        const selectElement = document.getElementById("tense-select");
        currentTense = selectElement.value;
        questionsList = quizData[currentTense];
        currentQuestionIndex = 0;
        
        document.getElementById("input-area").style.display = "flex";
        loadQuestion();
    }

    // Tải câu hỏi lên giao diện
    function loadQuestion() {
        resetUI();
        const currentQ = questionsList[currentQuestionIndex];
        
        document.getElementById("progress").innerText = `Câu: ${currentQuestionIndex + 1}/${questionsList.length}`;
        document.getElementById("question-text").innerHTML = currentQ.question;
    }

    // Kiểm tra đáp án
    function checkAnswer() {
        const userAnswer = document.getElementById("answer-input").value.trim().toLowerCase();
        const currentQ = questionsList[currentQuestionIndex];
        
        // Cắt các đáp án bằng dấu "/" và loại bỏ khoảng trắng dư thừa
        const correctAnswers = currentQ.answer.toLowerCase().split("/").map(item => item.trim());
        
        const feedbackEl = document.getElementById("feedback");
        const explanationEl = document.getElementById("explanation");
        const nextBtn = document.getElementById("next-btn");
        const checkBtn = document.getElementById("check-btn");

        if (userAnswer === "") {
            alert("Vui lòng nhập đáp án của bạn!");
            return;
        }

        if (correctAnswers.includes(userAnswer)) {
            feedbackEl.innerText = "✅ Chính xác!";
            feedbackEl.className = "feedback correct";
        } else {
            // In hoa chữ cái đầu của đáp án để hiển thị đẹp hơn
            const displayAnswer = currentQ.answer;
            feedbackEl.innerText = `❌ Sai rồi! Đáp án đúng là: ${displayAnswer}`;
            feedbackEl.className = "feedback incorrect";
        }

        // Hiện giải thích và nút Next
        explanationEl.innerHTML = `<strong>💡 Giải thích:</strong> ${currentQ.explanation}`;
        explanationEl.style.display = "block";
        nextBtn.style.display = "block";
        checkBtn.style.display = "none";
        document.getElementById("answer-input").disabled = true;
    }

    // Chuyển câu tiếp theo
    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questionsList.length) {
            loadQuestion();
        } else {
            document.getElementById("question-text").innerHTML = "<strong>🎉 Chúc mừng! Bạn đã hoàn thành xuất sắc 10 câu hỏi của thì này! Hãy chọn thì khác để tiếp tục luyện tập nhé.</strong>";
            document.getElementById("input-area").style.display = "none";
            resetUI();
        }
    }

    // Khôi phục giao diện cho câu hỏi mới
    function resetUI() {
        const inputEl = document.getElementById("answer-input");
        if(inputEl) {
            inputEl.value = "";
            inputEl.disabled = false;
            inputEl.focus();
        }
        
        document.getElementById("feedback").innerText = "";
        document.getElementById("explanation").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
        
        const checkBtn = document.getElementById("check-btn");
        if(checkBtn) checkBtn.style.display = "block";
    }

    // Chạy auto lần đầu khi load trang
    window.onload = startQuiz;

    // Cho phép nhấn Enter để kiểm tra hoặc qua câu
    document.getElementById("answer-input").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            if (document.getElementById("check-btn").style.display !== "none") {
                checkAnswer();
            } else {
                nextQuestion();
            }
        }
    });
</script>
