  <title>Chủ đề bổ trợ · Danh English Tutor</title>
  <script>
    const params = new URLSearchParams(location.search);
    const topic = params.get('topic');
    const grade = params.get('fromGrade');
    const topics = ['clocks', 'jobs', 'music', 'health', 'safety', 'plants', 'stories', 'tickets', 'cooking', 'celebrations'];
    if (topics.includes(topic)) {
      location.replace(topic + '.html?fromGrade=' + (/^[1-5]$/.test(grade) ? grade : '2'));
    }
  </script>
