name: Check lessons

on: [push, pull_request]

jobs:
  lessons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check lesson data and game rules
        run: node --test grade/lop2/tests/*.test.cjs grade/lop4/tests/*.test.cjs grade/lop7/tests/*.test.cjs tests/grammar-room/*.test.cjs tests/learner-profiles/*.test.cjs
      - name: Check JavaScript syntax
        run: find assets/data assets/js grade/lop2/assets/js grade/lop4/assets/js grade/lop6/assets/js grade/lop7/assets/js shared -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check local links and IDs
        run: node scripts/check-local-links.cjs
      - name: Check the shared footer
        run: node scripts/check-contact-footer.cjs
