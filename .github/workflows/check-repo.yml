name: Check lessons

on: [push, pull_request]

jobs:
  lessons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check lesson data and game rules
        run: node --test grade/lop2/tests/*.test.cjs grade/lop4/tests/*.test.cjs grade/lop7/tests/*.test.cjs tests/grammar-room/*.test.cjs tests/learner-profiles/*.test.cjs tests/primary-grades/*.test.cjs tests/secondary-grades/*.test.cjs tests/secondary-images/*.test.cjs tests/secondary-template/*.test.cjs tests/young-learner-speech/*.test.cjs tests/vocabulary-skills/*.test.cjs tests/site-letter-games/*.test.cjs
      - name: Check JavaScript syntax
        run: find assets/data assets/js grade shared -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check local links and IDs
        run: node scripts/check-local-links.cjs
      - name: Check the shared footer
        run: node scripts/check-contact-footer.cjs
      - name: Check Vietnamese fonts
        run: node scripts/check-vietnamese-fonts.cjs
      - name: Check online media and retirement of the old offline worker
        run: |
          node --check sw.js
          node --test tests/offline/*.test.cjs
          node --test tests/game-pacing/*.test.cjs
