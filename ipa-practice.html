<!DOCTYPE html>
<html lang="vi">
<head>
<script src="./shared/learner-profile-core.js"></script>
<script src="./shared/learner-profile.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Tập Phát Âm IPA - Thầy Danh</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./assets/css/pages/ipa-practice.css">
</head>
<body>

    <div class="top-nav">
        <a href="skills.html" class="btn-nav btn-back">⬅ Luyện theo kỹ năng</a>
    </div>

    <div class="main-content">
        <div class="container">
            <h1>🗣️ Luyện Phát Âm</h1>
            <p class="subtitle">Đọc phiên âm và gõ từ tiếng Anh tương ứng</p>

            <div class="tabs">
                <button class="tab-btn active" id="tab-basic" onclick="setLevel('basic')">Cơ Bản</button>
                <button class="tab-btn" id="tab-intermediate" onclick="setLevel('intermediate')">Trung Cấp</button>
                <button class="tab-btn" id="tab-toeic" onclick="setLevel('toeic')">TOEIC</button>
            </div>
            
           <div class="controls">
                <div class="stats" id="correct-display" style="background: #dcfce7; color: #15803d; border-color: #bbf7d0;">Đúng: 0</div>
                <div class="stats" id="incorrect-display" style="background: #fee2e2; color: #b91c1c; border-color: #fecaca;">Sai: 0</div>
                <div class="timer" id="timer-display">⏱️ 10:00</div>
                <div class="progress" id="progress">Từ: 1/240</div>
            </div>

            <div class="ipa-box" id="ipa-container">
                <div class="ipa-text" id="ipa-display"></div>
            </div>

            <div class="input-area" id="input-area">
                <input type="text" id="answer-input" placeholder="Nhập từ tiếng Anh..." autocomplete="off">
                <button class="btn-check" id="check-btn" onclick="checkAnswer()">Kiểm tra</button>
            </div>

            <div id="feedback" class="feedback"></div>
            <div id="explanation" class="explanation"></div>

            <button class="btn-next" id="next-btn" onclick="nextQuestion()">Từ tiếp theo ➔</button>
        </div>
    </div>

    <section class="contact-section">
        <h2>Kết nối với thầy Danh</h2>
        <div class="social-buttons">
            <a href="https://zalo.me/0911594794" target="_blank" class="btn-social btn-zalo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Icon_of_Zalo.svg" alt="Zalo" class="zalo-logo">
                Zalo: 0911594794
            </a>
            <a href="https://www.facebook.com/cong.danh.0210" target="_blank" class="btn-social btn-fb">
                <svg class="fb-icon" viewBox="0 0 24 24">
                    <path d="M22.675 0h-21.35c-.732 0-1.325.593-1.325 1.325v21.351c0 .731.593 1.324 1.325 1.324h11.495v-9.294h-3.128v-3.622h3.128v-2.671c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12v9.293h6.116c.73 0 1.323-.593 1.323-1.325v-21.35c0-.732-.593-1.325-1.325-1.325z"/>
                </svg>
                Facebook
            </a>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Học tiếng Anh cùng thầy Danh.</p>
    </footer>

<script src="./assets/js/pages/ipa-practice.js"></script>

</body>
</html>
