        body {
            font-family: 'Nunito', sans-serif;

            color: var(--text-main);

            flex-direction: column;

        }

        .top-nav {

            flex-wrap: wrap;
        }

        .btn-nav {
            padding: 8px 16px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s;
            background-color: #e2e8f0;
            color: var(--text-main);
        }

        .btn-nav:hover { background-color: #cbd5e1; }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 5px;
            font-weight: 800;
            font-size: 1.8rem;
        }
        
        .subtitle {
            color: var(--text-muted);
            margin-bottom: 25px;
            font-weight: 600;
        }

        .controls { margin-bottom: 20px; text-align: right; }
        .progress { font-weight: 800; color: var(--text-muted); font-size: 1.1rem; }

        .ipa-box {
            background: #fdf4ff;
            border: 2px dashed #f0abfc;
            padding: 30px 20px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .ipa-text {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--ipa-color);
            letter-spacing: 2px;
        }

        .input-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 1.5rem;
            text-align: center;
            font-family: inherit;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.3s;
            font-weight: 700;
        }

        input[type="text"]:focus { border-color: var(--ipa-color); }

        button {
            padding: 15px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            font-family: inherit;
            transition: background 0.3s;
            width: 100%;
        }

        .btn-check { background-color: var(--primary); color: white; }
        .btn-check:hover { background-color: var(--primary-hover); }

        .btn-next {
            background-color: #0ea5e9;
            color: white;
            display: none;
            margin-top: 10px;
        }
        .btn-next:hover { background-color: #0284c7; }

        .feedback {
            font-weight: 800;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }
        .correct { color: #16a34a; }
        .incorrect { color: #dc2626; }
        .auto-next-msg {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            color: #64748b;
            margin-top: 5px;
        }

        .explanation {
            background: #f1f5f9;
            color: var(--text-main);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 1.1rem;
            font-weight: 700;
        }
        
        .meaning {
            color: var(--primary);
            font-style: italic;
        }

        /* --- Contact Section --- */
        .contact-section {
            text-align: center; padding: 40px 20px;
            background: white; border-top: 1px solid #e2e8f0;
        }

        .contact-section h2 { font-size: 1.8rem; margin-bottom: 20px; color: var(--text-main); font-weight: 800; }
        .social-buttons { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        
        .btn-social {
            display: flex; align-items: center; gap: 10px; padding: 10px 25px;
            border-radius: 50px; font-size: 1.1rem; font-weight: 700;
            text-decoration: none; background-color: white; transition: all 0.3s ease;

        .btn-zalo { color: var(--zalo-color); border: 2px solid var(--zalo-color); }
        .btn-zalo:hover { background-color: var(--zalo-color); color: white; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0, 104, 255, 0.3); }
        .zalo-logo { width: 24px; height: 24px; border-radius: 6px; }

        .btn-fb { color: var(--fb-color); border: 2px solid var(--fb-color); }
        .btn-fb:hover { background-color: var(--fb-color); color: white; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(24, 119, 242, 0.3); }
        .fb-icon { width: 22px; height: 22px; fill: var(--fb-color); transition: fill 0.3s; }
        .btn-fb:hover .fb-icon { fill: white; }

        footer { text-align: center; padding: 15px; background: var(--text-main); color: white; font-size: 0.95rem; font-weight: 600; }
    </style>
</head>
<body>

        { ipa: "/ˈraɪs/", word: "rice", meaning: "gạo, cơm" },

        { ipa: "/ˈtʃiːz/", word: "cheese", meaning: "pho mát" },
        { ipa: "/ˈeɡ/", word: "egg", meaning: "quả trứng" },

        { ipa: "/ˈfəʊn/", word: "phone", meaning: "điện thoại" },
        { ipa: "/ˈtelɪvɪʒn/", word: "television", meaning: "tivi" },
        { ipa: "/kəmˈpjuːtə/", word: "computer", meaning: "máy tính" },
        { ipa: "/ˈkɑː/", word: "car", meaning: "xe hơi" },
        { ipa: "/ˈbʌs/", word: "bus", meaning: "xe buýt" },
        { ipa: "/ˈtreɪn/", word: "train", meaning: "tàu hỏa" },
        { ipa: "/ˈpleɪn/", word: "plane", meaning: "máy bay" },
        { ipa: "/ˈbəʊt/", word: "boat", meaning: "con thuyền" },
        { ipa: "/ˈbaɪk/", word: "bike", meaning: "xe đạp" },
        { ipa: "/ˈruːm/", word: "room", meaning: "căn phòng" }
    ];

    let currentQuestionIndex = 0;
    let autoNextTimeout; // Biến lưu timeout để quản lý bộ đếm

    function loadQuestion() {
        // Clear bất kỳ timeout nào còn sót lại khi qua câu
        if (autoNextTimeout) clearTimeout(autoNextTimeout);

        const currentQ = ipaData[currentQuestionIndex];
        document.getElementById("progress").innerText = `Từ: ${currentQuestionIndex + 1}/${ipaData.length}`;
        document.getElementById("ipa-display").innerText = currentQ.ipa;
        resetUI();
    }

    function checkAnswer() {
        const userAnswer = document.getElementById("answer-input").value.trim().toLowerCase();
        const currentQ = ipaData[currentQuestionIndex];
        const correctAnswers = currentQ.word.toLowerCase().split("/").map(item => item.trim());
        
        const feedbackEl = document.getElementById("feedback");
        const explanationEl = document.getElementById("explanation");
        const nextBtn = document.getElementById("next-btn");
        const checkBtn = document.getElementById("check-btn");

        if (userAnswer === "") {
            alert("Vui lòng nhập từ tiếng Anh của bạn!");
            return;
        }

        // Hiện box chứa từ đúng và nghĩa
        explanationEl.innerHTML = `Từ đúng: <strong>${currentQ.word}</strong> <br> <span class="meaning">Nghĩa là: ${currentQ.meaning}</span>`;
        explanationEl.style.display = "block";
        checkBtn.style.display = "none";
        document.getElementById("answer-input").disabled = true;

        if (correctAnswers.includes(userAnswer)) {
            // TRẢ LỜI ĐÚNG
            feedbackEl.innerHTML = `✅ Chính xác! <span class="auto-next-msg">Đang chuyển từ tiếp theo trong 2 giây...</span>`;
            feedbackEl.className = "feedback correct";
            nextBtn.style.display = "none"; // Ẩn nút next, bắt buộc đợi auto

            // Đặt thời gian 2 giây tự động qua bài
            autoNextTimeout = setTimeout(() => {
                nextQuestion();
            }, 2000);

        } else {
            // TRẢ LỜI SAI
            const displayAnswer = correctAnswers[0];
            feedbackEl.innerText = `❌ Sai rồi! Đáp án đúng là: ${displayAnswer}`;
            feedbackEl.className = "feedback incorrect";
            nextBtn.style.display = "block"; // Hiện nút next để học viên xem lại, sẵn sàng mới bấm qua
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < ipaData.length) {
            loadQuestion();
        } else {
            document.getElementById("ipa-display").innerText = "🎉";
            document.getElementById("input-area").style.display = "none";
            document.getElementById("progress").innerText = "Hoàn thành!";
            
            const explanationEl = document.getElementById("explanation");
            explanationEl.innerHTML = "<strong>Chúc mừng! Bạn đã hoàn thành 100 từ vựng và nắm vững 44 âm IPA!</strong>";
            explanationEl.style.display = "block";
            
            resetUI();
            document.getElementById("check-btn").style.display = "none";
            document.getElementById("feedback").style.display = "none";
        }
    }

    function resetUI() {
        const inputEl = document.getElementById("answer-input");
        if(inputEl) {
            inputEl.value = "";
            inputEl.disabled = false;
            inputEl.focus();
        }
        
        document.getElementById("feedback").innerText = "";
        document.getElementById("explanation").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
        
        const checkBtn = document.getElementById("check-btn");
        if(checkBtn && currentQuestionIndex < ipaData.length) {
            checkBtn.style.display = "block";
        }
    }

    // Chạy hàm khi load trang
    window.onload = loadQuestion;

    // Cho phép ấn Enter để kiểm tra hoặc qua bài (nếu đang trả lời sai)
    document.getElementById("answer-input").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            if (document.getElementById("check-btn").style.display !== "none") {
                checkAnswer();
            } else if (document.getElementById("next-btn").style.display !== "none") {
                nextQuestion();
            }
        }
    });
